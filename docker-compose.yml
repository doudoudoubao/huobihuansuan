services:
  bot:
    build: .
    container_name: huobihuansuan
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/bot.db
    volumes:
      - ./data:/app/data
    # 只有 webhook 模式才需要暴露端口；长轮询模式可以整段删掉
    # ports:
    #   - "8080:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
